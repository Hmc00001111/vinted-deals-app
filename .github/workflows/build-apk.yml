name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy a besoin d'un Python de même version que celui embarqué (3.12)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VintedDeals.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VintedDeals-apk
          path: VintedDeals.apk

      - name: Publier dans la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VintedDeals.apk \
            --title "Vinted Deals (dernière version)" \
            --notes "APK compilée automatiquement depuis ${GITHUB_SHA::7}."
